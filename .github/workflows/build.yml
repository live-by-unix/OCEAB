name: Build and Release OCEAB

on:
  push:
    tags:
      - 'v*' # This triggers the release when you push a tag like v1.0.1

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: oceab-windows.exe
          - os: ubuntu-latest
            artifact_name: oceab-linux
          - os: macos-latest
            artifact_name: oceab-mac.app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Libs
        run: pip install nuitka numpy pandas matplotlib

      - name: Build with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: oceab.py
          onefile: true

      - name: Upload for Release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: build/oceab* # Grabs whatever Nuitka spit out

  release:
    needs: build # This waits for Windows, Mac, and Linux to finish!
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/**
          name: OCEAB Release ${{ github.ref_name }}
          body: |
            New OCEAB Build!
            Compatible with Minecraft Snapshot 26.1 Pre.2
          draft: false
          prerelease: false
