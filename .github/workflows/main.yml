name: Build and Release OCEAB22

on:
  push:
    branches: [ main ]
  workflow_dispatch:      # This allows you to click the manual "Run" button
  release:
    types: [published]    # This runs when you make a new release

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: oceab-windows.exe
          - os: ubuntu-latest
            artifact_name: oceab-linux
          - os: macos-latest
            artifact_name: oceab-mac.app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Dependencies
        run: |
          pip install numpy pandas matplotlib nuitka
          # Add any other libraries you use here (e.g., pip install requests)

      - name: Build with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: oceab.py
          mode: onefile
          standalone: true
          show-memory: true
          assume-yes-for-downloads: true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: build/oceab*

  release:
    needs: build
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/**
          name: OCEAB Release ${{ github.ref_name }}
          body: |
            OCEAB Build v2.0
            Compiled for Windows, Linux, and macOS.
            Optimized for Minecraft Snapshot 26.1 Pre.2
          draft: false
          prerelease: false
